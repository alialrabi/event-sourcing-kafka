apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: wallet-ingress
spec:
    ingressClassName: nginx

    rules:
        - host: wallet.local
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: wallet-app
                            port:
                                number: 80