apiVersion: apps/v1
kind: Deployment
metadata:
    name: wallet-app

spec:
    replicas: {{ .Values.replicaCount }}

    selector:
        matchLabels:
            app: wallet-app

    template:
        metadata:
            labels:
                app: wallet-app

        spec:
            containers:
                - name: wallet-app
                  image: "{{.Values.image.repository}}:{{.Values.image.tag}}"

                  ports:
                      - containerPort: {{ .Values.service.targetPort }}

                  envFrom:

                      # Non-secret configuration
                      - configMapRef:
                            name: app-config

                      # Passwords and credentials
                      - secretRef:
                            name: app-secrets

                  resources:
                      requests:
                          cpu: "200m"
                          memory: "256Mi"

                      limits:
                          cpu: "500m"
                          memory: "512Mi"